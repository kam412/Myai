<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
  :root {
    --bg: #16191c;
    --panel: #1e2226;
    --border: #2c3237;
    --text: #e8e6e1;
    --muted: #8a9099;
    --accent: #5fa8a0;
    --accent-dim: #3c6864;
    --user-bubble: #2a2f34;
    --error: #c86b5c;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header span {
    font-size: 13px;
    color: var(--muted);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 3px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .msg.error {
    align-self: flex-start;
    background: transparent;
    border: 1px solid var(--error);
    color: var(--error);
  }
  .msg.assistant.pending::after {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 4px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 24px 22px;
    border-top: 1px solid var(--border);
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 11px 14px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.4;
    max-height: 160px;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  button {
    background: var(--accent);
    color: #10201d;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: var(--accent-dim);
    color: var(--muted);
    cursor: not-allowed;
  }
  #log:empty::before {
    content: "Say something to get started.";
    color: var(--muted);
    margin: auto;
  }
</style>
</head>
<body>

<header>
  <h1>My AI</h1>
  <span>running on NVIDIA's hosted API</span>
  <input id="proxyUrl" type="text" spellcheck="false"
    placeholder="http://127.0.0.1:8787/chat"
    style="margin-left:auto;background:var(--panel);border:1px solid var(--border);
           color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12px;width:280px;">
</header>

<div id="log"></div>

<form id="form">
  <textarea id="input" placeholder="Message..." rows="1"></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
// This page now talks to a proxy (proxy.py) instead of NVIDIA directly.
// The API key lives in proxy.py (as an environment variable), not here.
//
// Local use: run `python3 proxy.py` in a terminal, leave the field above as-is.
// GitHub Codespaces: run the proxy there, set its port's visibility to
// "Public" in the Ports tab, then paste that forwarded URL + "/chat" into
// the field above (e.g. https://your-codespace-8787.app.github.dev/chat).
const MODEL = "moonshotai/kimi-k3";
const proxyUrlInput = document.getElementById("proxyUrl");
proxyUrlInput.value = "http://127.0.0.1:8787/chat";

const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

let history = [];

function addBubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addBubble("user", text);
  history.push({ role: "user", content: text });
  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;

  const assistantDiv = addBubble("assistant", "");
  assistantDiv.classList.add("pending");

  try {
    const endpoint = proxyUrlInput.value.trim() || "http://127.0.0.1:8787/chat";
    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "text/event-stream",
      },
      body: JSON.stringify({
        model: MODEL,
        messages: history,
        max_tokens: 4096,
        temperature: 1,
        stream: true,
      }),
    });

    if (!response.ok || !response.body) {
      const errText = await response.text().catch(() => "");
      throw new Error("HTTP " + response.status + (errText ? ": " + errText.slice(0, 200) : ""));
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split("\n");
      buffer = lines.pop(); // keep the last partial line for next chunk

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith("data:")) continue;
        const data = trimmed.slice(5).trim();
        if (data === "[DONE]") continue;

        try {
          const parsed = JSON.parse(data);
          const delta = parsed.choices?.[0]?.delta?.content;
          if (delta) {
            full += delta;
            assistantDiv.textContent = full;
            log.scrollTop = log.scrollHeight;
          }
        } catch (_) {
          // ignore malformed/partial SSE chunks
        }
      }
    }

    assistantDiv.classList.remove("pending");
    history.push({ role: "assistant", content: full });

  } catch (err) {
    assistantDiv.classList.remove("pending");
    assistantDiv.classList.remove("assistant");
    assistantDiv.classList.add("error");
    assistantDiv.textContent =
      "Request failed: " + err.message +
      "\n\nMake sure proxy.py is running — open a terminal, run `python3 proxy.py`, " +
      "and leave that window open while you use this page.";
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
